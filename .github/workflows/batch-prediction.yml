name: Offline September mock-support snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: september-snapshot
  cancel-in-progress: false
jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify data and privacy tests
        run: python -m pytest -q
      - name: Download consented cohort from private server
        env:
          COHORT_EXPORT_URL: ${{ secrets.COHORT_EXPORT_URL }}
          COHORT_EXPORT_BEARER_TOKEN: ${{ secrets.COHORT_EXPORT_BEARER_TOKEN }}
        run: |
          test -n "$COHORT_EXPORT_URL" && test -n "$COHORT_EXPORT_BEARER_TOKEN" || { echo 'Private export secrets not configured'; exit 1; }
          case "$COHORT_EXPORT_URL" in https://*) ;; *) echo 'Only HTTPS export URL allowed'; exit 1 ;; esac
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --max-time 60 --max-filesize 20000000 \
            --header "Authorization: Bearer $COHORT_EXPORT_BEARER_TOKEN" \
            --output "$RUNNER_TEMP/private-cohort.csv" "$COHORT_EXPORT_URL"
      - name: Build non-identifying aggregate only
        env:
          ADMISSION_DB: ${{ runner.temp }}/snapshot-rules.sqlite3
        run: |
          python -m scripts.batch_cohort \
            --private-input "$RUNNER_TEMP/private-cohort.csv" \
            --output data/public/snapshots/2027-september.json
          rm -f "$RUNNER_TEMP/private-cohort.csv"
      - name: Commit only public aggregate snapshot (triggers Pages)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public/snapshots/2027-september.json
          if git diff --cached --quiet; then echo 'No change'; else
            git commit -m 'data: publish offline September mock-support aggregate'
            git push
          fi
