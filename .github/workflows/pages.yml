name: Deploy public research dashboard to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'data/public/**'
      - 'scripts/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify tests before deployment
        env:
          ADMISSION_DB: ${{ runner.temp }}/deploy-tests.sqlite3
        run: python -m pytest -q
      - name: Audit public data
        run: python -m scripts.audit --output audit-report.json
      - name: Export static dashboard (no personal outcomes)
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: python -m scripts.build_pages --output site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
